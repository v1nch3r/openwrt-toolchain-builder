name: Build Toolchain

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform'
        required: true
        type: choice
        options:
          - x86_64
          - armvirt64
          - bcm27xx
          - bcm2709
          - rockchip
        default: x86_64
      source_repo:
        description: 'OpenWrt source repo URL'
        required: true
        default: 'https://github.com/coolsnowwolf/lede'
      source_branch:
        description: 'Source branch'
        required: true
        default: 'master'
      upload_release:
        description: 'Upload to GitHub Release?'
        required: true
        type: boolean
        default: true

env:
  TZ: UTC
  BUILD_ROOT: /tmp/openwrt-build

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # ============================================================
      # Step 1: Free up disk space
      # GitHub runners start with ~14GB free, but we need ~25GB
      # Remove unnecessary pre-installed SDKs
      # ============================================================
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/lib/firefox \
            /usr/lib/google-cloud-sdk \
            /usr/local/aws-cli \
            /opt/pipx
          sudo apt-get clean
          sudo apt-get autoremove -y --purge
          echo "=== After cleanup ==="
          df -h /

      # ============================================================
      # Step 2: Install build dependencies
      # These are the minimum tools needed to compile OpenWrt
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev \
            device-tree-compiler libelf-dev libdw-dev \
            qemu-utils ccache
          echo "=== Dependencies installed ==="

      # ============================================================
      # Step 3: Checkout this repo (for config files)
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Step 4: Clone OpenWrt source
      # ============================================================
      - name: Clone source
        id: clone
        run: |
          mkdir -p ${{ env.BUILD_ROOT }}
          cd ${{ env.BUILD_ROOT }}
          git clone --depth=1 ${{ inputs.source_repo }} -b ${{ inputs.source_branch }} openwrt
          cd openwrt
          echo "OPENWRTROOT=$PWD" >> $GITHUB_ENV
          echo "OPENWRT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "OPENWRT_DATE=$(git log -1 --format=%cd --date=format:%Y%m%d)" >> $GITHUB_ENV
          echo "=== Cloned: ${{ inputs.source_repo }} @ ${{ inputs.source_branch }} ==="
          echo "Commit: ${{ env.OPENWRT_HASH }} (${{ env.OPENWRT_DATE }})"

      # ============================================================
      # Step 5: Update & install feeds
      # Feeds = package repositories (luci, packages, routing, etc.)
      # ============================================================
      - name: Update feeds
        run: |
          cd ${{ env.BUILD_ROOT }}/openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "=== Feeds installed ==="

      # ============================================================
      # Step 6: Apply target configuration
      # Each target has its own config file in config/ directory
      # ============================================================
      - name: Configure toolchain
        run: |
          cd ${{ env.BUILD_ROOT }}/openwrt
          TARGET_CONFIG="config/${{ inputs.target }}.conf"
          if [ -f "$GITHUB_WORKSPACE/$TARGET_CONFIG" ]; then
            cp "$GITHUB_WORKSPACE/$TARGET_CONFIG" .config
            echo "=== Using config: $TARGET_CONFIG ==="
          else
            echo "=== Config $TARGET_CONFIG not found, using minimal ==="
            echo "CONFIG_MAKE_TOOLCHAIN=y" > .config
          fi
          make defconfig
          echo "=== Configuration applied ==="
          echo "--- Config summary ---"
          grep -E "^CONFIG_TARGET|^CONFIG_MAKE_TOOLCHAIN|^CONFIG_GCC_VERSION|^CONFIG_BINUTILS" .config || true

      # ============================================================
      # Step 7: Build toolchain
      # This is the main step — compiles gcc, binutils, glibc/musl
      # Takes 1-3 hours depending on target and runner speed
      # ============================================================
      - name: Build toolchain
        run: |
          cd ${{ env.BUILD_ROOT }}/openwrt
          echo "=== Building toolchain (this takes 1-3 hours) ==="
          make toolchain/install -j$(nproc) V=s 2>&1 | tail -50
          echo "=== Toolchain build complete ==="

          # Verify toolchain
          echo "=== Toolchain verification ==="
          ls -la staging_dir/toolchain-*/bin/ | head -20
          echo ""
          echo "GCC version:"
          staging_dir/toolchain-*/bin/*gcc --version 2>/dev/null | head -1 || echo "gcc not found"
          echo ""
          echo "Toolchain directory size:"
          du -sh staging_dir/toolchain-*/

      # ============================================================
      # Step 8: Pack toolchain into .img file
      # .img format allows direct mount + overlay (like HelmiWrt)
      # ============================================================
      - name: Pack toolchain image
        run: |
          cd ${{ env.BUILD_ROOT }}/openwrt
          TOOLCHAIN_NAME="toolchain-${{ inputs.target }}-${{ env.OPENWRT_DATE }}-${{ env.OPENWRT_HASH }}"
          echo "TOOLCHAIN_NAME=$TOOLCHAIN_NAME" >> $GITHUB_ENV

          # --- Method 1: .tar.gz (smaller, universal) ---
          echo "=== Packing .tar.gz ==="
          tar -czf "$GITHUB_WORKSPACE/$TOOLCHAIN_NAME.tar.gz" \
            -C staging_dir \
            $(ls staging_dir/ | grep toolchain)

          # --- Method 2: .img (mountable, overlay-ready) ---
          echo "=== Packing .img ==="
          # Calculate size needed (toolchain dir + 20% overhead)
          SIZE=$(du -sm staging_dir/toolchain-* | cut -f1)
          IMG_SIZE=$((SIZE + SIZE / 5 + 100))
          echo "Image size: ${IMG_SIZE}MB"

          # Create empty image
          dd if=/dev/zero of="$GITHUB_WORKSPACE/$TOOLCHAIN_NAME.img" bs=1M count=$IMG_SIZE status=progress
          mkfs.ext4 -F "$GITHUB_WORKSPACE/$TOOLCHAIN_NAME.img"

          # Mount and copy
          mkdir -p /tmp/img-mount
          sudo mount -o loop "$GITHUB_WORKSPACE/$TOOLCHAIN_NAME.img" /tmp/img-mount
          sudo cp -a staging_dir/toolchain-* /tmp/img-mount/
          sudo cp -a staging_dir/target-* /tmp/img-mount/ 2>/dev/null || true
          sudo cp -a staging_dir/host* /tmp/img-mount/ 2>/dev/null || true
          sudo umount /tmp/img-mount

          # Compress image
          echo "=== Compressing .img ==="
          gzip -f "$GITHUB_WORKSPACE/$TOOLCHAIN_NAME.img"

          echo "=== Output files ==="
          ls -lh "$GITHUB_WORKSPACE/"$TOOLCHAIN_NAME.*

      # ============================================================
      # Step 9: Upload artifacts (always, for debugging)
      # ============================================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ inputs.target }}
          path: |
            ${{ github.workspace }}/toolchain-*.tar.gz
            ${{ github.workspace }}/toolchain-*.img.gz
          retention-days: 7

      # ============================================================
      # Step 10: Upload to GitHub Release (optional)
      # ============================================================
      - name: Upload to release
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: toolchain-${{ inputs.target }}-${{ env.OPENWRT_DATE }}
          name: Toolchain ${{ inputs.target }} (${{ env.OPENWRT_DATE }})
          body: |
            ## OpenWrt Toolchain — ${{ inputs.target }}

            | Info | Value |
            |------|-------|
            | Target | `${{ inputs.target }}` |
            | Source | `${{ inputs.source_repo }}` |
            | Branch | `${{ inputs.source_branch }}` |
            | Commit | `${{ env.OPENWRT_HASH }}` |
            | Date | ${{ env.OPENWRT_DATE }} |

            ### Download
            - `toolchain-*.tar.gz` — universal tarball
            - `toolchain-*.img.gz` — mountable image (overlay-ready)

            ### Usage
            ```bash
            gunzip toolchain-*.img.gz
            mkdir -p openwrt-ro overlay workdir
            mount -o loop toolchain-*.img openwrt-ro
            mount -t overlay overlay -o lowerdir=openwrt-ro,upperdir=overlay,workdir=workdir openwrt
            ```
          files: |
            ${{ github.workspace }}/toolchain-*.tar.gz
            ${{ github.workspace }}/toolchain-*.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # Step 11: Summary
      # ============================================================
      - name: Build summary
        if: always()
        run: |
          echo "## 📦 Toolchain Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Target | \`${{ inputs.target }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source | \`${{ inputs.source_repo }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ inputs.source_branch }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ env.OPENWRT_HASH }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Date | ${{ env.OPENWRT_DATE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY