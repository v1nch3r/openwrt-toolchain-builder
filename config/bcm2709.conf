# Raspberry Pi 2/3 Configuration (BCM2709)

# Explicitly disable other targets
# CONFIG_TARGET_x86 is not set
# CONFIG_TARGET_armvirt is not set
# CONFIG_TARGET_rockchip is not set

# Target
CONFIG_TARGET_bcm27xx=y
CONFIG_TARGET_bcm27xx_bcm2709=y

# Build toolchain
CONFIG_MAKE_TOOLCHAIN=y

# C Library
CONFIG_LIBC_USE_GLIBC=y

# Kernel
CONFIG_TARGET_KERNEL_PARTSIZE=64
CONFIG_TARGET_ROOTFS_PARTSIZE=1024
CONFIG_KERNEL_BUILD_USER="isaac"
CONFIG_KERNEL_BUILD_DOMAIN="github.com"