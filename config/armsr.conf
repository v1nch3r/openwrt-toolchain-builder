# ARM SystemReady 64-bit Configuration
# For Amlogic S905X (via amlogic-s9xxx repacker), QEMU ARM64, generic ARM64
# Replaces armvirt64 which was removed from LEDE

# Explicitly disable other targets
# CONFIG_TARGET_x86 is not set
# CONFIG_TARGET_rockchip is not set
# CONFIG_TARGET_bcm27xx is not set
# CONFIG_TARGET_amlogic is not set

# Target
CONFIG_TARGET_armsr=y
CONFIG_TARGET_armsr_armv8=y

# Build toolchain
CONFIG_MAKE_TOOLCHAIN=y

# C Library (musl = smaller, glibc = more compatible)
CONFIG_LIBC_USE_MUSL=y

# Kernel
CONFIG_TARGET_KERNEL_PARTSIZE=64
CONFIG_TARGET_ROOTFS_PARTSIZE=1024
CONFIG_KERNEL_BUILD_USER="isaac"
CONFIG_KERNEL_BUILD_DOMAIN="github.com"