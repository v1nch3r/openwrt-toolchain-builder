# ARM Virtual 64-bit Configuration
# For Amlogic S905X/S905X3/S912, QEMU ARM64, generic ARM64

# Target
CONFIG_TARGET_armvirt=y
CONFIG_TARGET_armvirt_64=y
CONFIG_TARGET_armvirt_64_Default=y

# Build toolchain
CONFIG_MAKE_TOOLCHAIN=y

# Compiler
CONFIG_GCC_VERSION_11=y
CONFIG_BINUTILS_VERSION_2_37=y

# C Library (musl = smaller, glibc = more compatible)
CONFIG_LIBC_USE_MUSL=y

# Kernel
CONFIG_TARGET_KERNEL_PARTSIZE=64
CONFIG_TARGET_ROOTFS_PARTSIZE=1024
CONFIG_KERNEL_BUILD_USER="isaac"
CONFIG_KERNEL_BUILD_DOMAIN="github.com"